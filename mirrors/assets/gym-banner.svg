<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="gym-donkeycar dependency mirror — pinned at beac6ff, 249 commits, 11 tracks, Unity simulator bridge over TCP 9091">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E6FD9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E6FD9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 42px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#bg)"/>
  <circle cx="960" cy="125" r="180" fill="url(#glow)"/>

  <!-- 좌측: 트랙 루프 모티프 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="54" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M -34 -22 C -56 -22 -56 22 -34 22 L 20 22 C 48 22 48 -22 20 -22 Z"
          fill="none" stroke="#1E6FD9" stroke-opacity="0.55" stroke-width="9" stroke-linejoin="round"/>
    <path d="M -34 -22 C -56 -22 -56 22 -34 22 L 20 22 C 48 22 48 -22 20 -22 Z"
          fill="none" stroke="#7FB2FF" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="5 6"/>
    <circle cx="20" cy="-22" r="4.6" fill="#16A34A"/>
    <circle cx="20" cy="-22" r="9" fill="none" stroke="#16A34A" stroke-opacity="0.45" stroke-width="1.4"/>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="76">DEPENDENCY MIRROR</text>
  <text class="t h1" x="196" y="126">gym-donkeycar, pinned safely</text>
  <text class="t sub" x="196" y="156">Mirror of tawnkramer/gym-donkeycar · pinned at beac6ff · the fork's master tip is empty</text>

  <!-- 태그 -->
  <g transform="translate(196,178)">
    <g>
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="59" y="17.5" text-anchor="middle">249 commits</text>
    </g>
    <g transform="translate(128,0)">
      <rect x="0" y="0" width="96" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="48" y="17.5" text-anchor="middle">60 files</text>
    </g>
    <g transform="translate(234,0)">
      <rect x="0" y="0" width="92" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.45"/>
      <text class="t tag mono" x="46" y="17.5" text-anchor="middle">v1.3.1</text>
    </g>
    <g transform="translate(336,0)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="43" y="17.5" text-anchor="middle">11 tracks</text>
    </g>
    <g transform="translate(432,0)">
      <rect x="0" y="0" width="188" height="26" rx="13" fill="#EAB308" fill-opacity="0.14" stroke="#EAB308" stroke-opacity="0.40"/>
      <text class="t tag mono" x="94" y="17.5" text-anchor="middle">default: aypi-pinned</text>
    </g>
  </g>

  <!-- 우측: sim ⇄ gym ⇄ donkeycar -->
  <g transform="translate(866,52)" opacity="0.94">
    <g fill="#132C52" stroke="#2B4F85">
      <rect x="0" y="0" width="200" height="38" rx="6"/>
      <rect x="0" y="62" width="200" height="38" rx="6"/>
      <rect x="0" y="124" width="200" height="38" rx="6"/>
    </g>
    <g class="t mono" font-size="10.5" fill="#7FB2FF" text-anchor="middle">
      <text x="100" y="24">manage.py drive</text>
      <text x="100" y="148">donkey_sim.exe</text>
    </g>
    <rect x="0" y="62" width="200" height="38" rx="6" fill="#0B1B33" stroke="#16A34A" stroke-opacity="0.6"/>
    <text class="t mono" x="100" y="86" font-size="10.5" fill="#16A34A" text-anchor="middle">gym-donkeycar</text>
    <g stroke="#3E6FA8" stroke-dasharray="3 3">
      <line x1="100" y1="38" x2="100" y2="62"/>
      <line x1="100" y1="100" x2="100" y2="124"/>
    </g>
    <text class="t mono" x="112" y="117" font-size="9.5" fill="#6F87A6">TCP :9091</text>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>
</svg>
