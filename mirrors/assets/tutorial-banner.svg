<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Vibe-coding camp session 1 — drive the simulator yourself, train a model on your own driving, then hand it the wheel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E6FD9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E6FD9" stop-opacity="0"/>
    </radialGradient>
    <marker id="cyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7FB2FF"/>
    </marker>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 40px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#bg)"/>
  <circle cx="960" cy="125" r="180" fill="url(#glow)"/>

  <!-- 좌측: 트랙 위의 차 + 카메라 시야 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="56" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M -34 -24 C -58 -24 -58 24 -34 24 L 20 24 C 50 24 50 -24 20 -24 Z"
          fill="none" stroke="#1E6FD9" stroke-opacity="0.5" stroke-width="10" stroke-linejoin="round"/>
    <path d="M -34 -24 C -58 -24 -58 24 -34 24 L 20 24 C 50 24 50 -24 20 -24 Z"
          fill="none" stroke="#7FB2FF" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5 6"/>
    <g transform="translate(20,-24)">
      <path d="M 0 0 L 26 -15 L 26 15 Z" fill="#16A34A" fill-opacity="0.22"/>
      <circle r="5" fill="#16A34A"/>
      <circle r="10" fill="none" stroke="#16A34A" stroke-opacity="0.45" stroke-width="1.4"/>
    </g>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="74">VIBE-CODING CAMP · SESSION 1</text>
  <text class="t h1" x="196" y="124">teach a car to drive like you</text>
  <text class="t sub" x="196" y="154">Drive the simulator yourself, train a model on your own driving, then hand it the wheel.</text>

  <!-- 태그 -->
  <g transform="translate(196,176)">
    <g>
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="42" y="17.5" text-anchor="middle">one day</text>
    </g>
    <g transform="translate(94,0)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="43" y="17.5" text-anchor="middle">Windows</text>
    </g>
    <g transform="translate(190,0)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="75" y="17.5" text-anchor="middle">conda: donkeybro</text>
    </g>
    <g transform="translate(350,0)">
      <rect x="0" y="0" width="102" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.45"/>
      <text class="t tag mono" x="51" y="17.5" text-anchor="middle">Python 3.9</text>
    </g>
  </g>

  <!-- 우측: 행동 복제 사이클 -->
  <g transform="translate(958,125)" opacity="0.95">
    <circle r="74" fill="none" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>
    <g class="t mono" font-size="10.5" text-anchor="middle">
      <g>
        <rect x="-46" y="-90" width="92" height="24" rx="12" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="0" y="-74" fill="#7FB2FF">you drive</text>
      </g>
      <g>
        <rect x="72" y="-12" width="76" height="24" rx="12" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="110" y="4" fill="#7FB2FF">tub</text>
      </g>
      <g>
        <rect x="-40" y="66" width="80" height="24" rx="12" fill="#0B1B33" stroke="#16A34A" stroke-opacity="0.6"/>
        <text x="0" y="82" fill="#16A34A">train</text>
      </g>
      <g>
        <rect x="-150" y="-12" width="78" height="24" rx="12" fill="#0B1B33" stroke="#7C3AED" stroke-opacity="0.6"/>
        <text x="-111" y="4" fill="#C4A3F5">it drives</text>
      </g>
    </g>
    <g fill="none" stroke="#7FB2FF" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#cyc)">
      <path d="M 50 -56 A 74 74 0 0 1 72 -14"/>
      <path d="M 72 26 A 74 74 0 0 1 36 62"/>
      <path d="M -40 60 A 74 74 0 0 1 -73 16"/>
      <path d="M -72 -16 A 74 74 0 0 1 -44 -58"/>
    </g>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>
</svg>
