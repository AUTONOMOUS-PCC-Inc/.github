<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Folder map: which directories arrive with the clone, which one you download, and which one you create">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#112744"/>
    </linearGradient>
    <style>
      .t    { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
      .dir  { font-size: 13px; font-weight: 600; fill: #E9F1FD; }
      .out  { font-size: 11px; fill: #8FA3BF; }
      .io   { font-size: 12px; font-weight: 600; fill: #BFD3EE; }
      .cap  { font-size: 11.5px; fill: #6F87A6; }
      .sec  { font-size: 12px; font-weight: 600; fill: #7FB2FF; letter-spacing: 2px; }
      .bdg  { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="10" fill="url(#pbg)"/>
  <text class="t sec" x="28" y="34">WHAT IS IN THIS FOLDER</text>
  <text class="t cap" x="1172" y="34" text-anchor="end">blue arrives with the clone · yellow you download · green you create</text>

  <!-- 루트 -->
  <g transform="translate(28,52)">
    <rect width="1144" height="40" rx="8" fill="#0E2342" stroke="#2B4F85"/>
    <text class="t mono dir" x="18" y="25">aypi-car-tutorial/</text>
    <text class="t cap" x="190" y="25">the folder you cloned — the install guide uses this same name, so the two always match</text>
  </g>

  <!-- 트리 세로선 -->
  <line x1="46" y1="92" x2="46" y2="352" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 1 donkeycar -->
  <g transform="translate(64,104)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#12294A" stroke="#1E6FD9" stroke-opacity="0.55"/>
    <text class="t mono dir" x="16" y="25" fill="#7FB2FF">donkeycar/</text>
    <rect x="150" y="11" width="86" height="19" rx="9" fill="#1E6FD9" fill-opacity="0.18" stroke="#1E6FD9" stroke-opacity="0.45"/>
    <text class="t mono bdg" x="193" y="24" fill="#7FB2FF" text-anchor="middle">submodule</text>
    <text class="t out" x="290" y="25">the library itself — the one place you run `pip install -e .`</text>
  </g>

  <!-- 2 gym-donkeycar -->
  <g transform="translate(64,150)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#12294A" stroke="#1E6FD9" stroke-opacity="0.55"/>
    <text class="t mono dir" x="16" y="25" fill="#7FB2FF">gym-donkeycar/</text>
    <rect x="150" y="11" width="86" height="19" rx="9" fill="#1E6FD9" fill-opacity="0.18" stroke="#1E6FD9" stroke-opacity="0.45"/>
    <text class="t mono bdg" x="193" y="24" fill="#7FB2FF" text-anchor="middle">submodule</text>
    <text class="t out" x="290" y="25">the bridge to the simulator — nothing for you to install here</text>
  </g>

  <!-- 3 envs -->
  <g transform="translate(64,196)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#12294A" stroke="#2B4F85"/>
    <text class="t mono dir" x="16" y="25">envs/</text>
    <text class="t out" x="290" y="25">aypi-car_for_windows.yml — the conda environment aypi-car is built from this file</text>
  </g>

  <!-- 4 library_sheet -->
  <g transform="translate(64,242)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#12294A" stroke="#2B4F85"/>
    <text class="t mono dir" x="16" y="25">library_sheet/</text>
    <text class="t out" x="290" y="25">the extra pip packages the environment still needs</text>
  </g>

  <!-- 5 DonkeySimWin -->
  <g transform="translate(64,288)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#1C1A10" stroke="#EAB308" stroke-opacity="0.6"/>
    <text class="t mono dir" x="16" y="25" fill="#F3D468">DonkeySimWin/</text>
    <rect x="150" y="11" width="104" height="19" rx="9" fill="#EAB308" fill-opacity="0.16" stroke="#EAB308" stroke-opacity="0.45"/>
    <text class="t mono bdg" x="202" y="24" fill="#F3D468" text-anchor="middle">you download</text>
    <text class="t out" x="290" y="25">donkey_sim.exe lives here — unzip it right here, not anywhere else</text>
  </g>

  <!-- 6 cars/mycar -->
  <g transform="translate(64,334)">
    <line x1="-18" y1="20" x2="0" y2="20" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 3"/>
    <rect width="1108" height="40" rx="8" fill="#0B2A1C" stroke="#16A34A" stroke-opacity="0.7"/>
    <text class="t mono dir" x="16" y="25" fill="#6EE7A0">cars/mycar/</text>
    <rect x="150" y="11" width="88" height="19" rx="9" fill="#16A34A" fill-opacity="0.18" stroke="#16A34A" stroke-opacity="0.45"/>
    <text class="t mono bdg" x="194" y="24" fill="#6EE7A0" text-anchor="middle">you create</text>
    <text class="t out" x="290" y="25">your car — data/ holds the tub, models/ holds the pilot, myconfig.py is the settings</text>
  </g>

  <text class="t cap" x="28" y="392">You spend almost the whole day inside cars/mycar. When a command fails, check which folder you are standing in first.</text>
</svg>
