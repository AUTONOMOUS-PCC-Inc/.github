<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Vibe-coding camp session 3 — describe a shape in words, export it to GLB, then walk around inside the space you built">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 40px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#bg)"/>
  <circle cx="975" cy="125" r="185" fill="url(#glow)"/>

  <!-- 좌측: 말로 만든 입체 — 아이소메트릭 큐브에서 구를 빼는 모양 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="58" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <g fill="none" stroke="#1E6FD9" stroke-opacity="0.75" stroke-width="2" stroke-linejoin="round">
      <path d="M 0 -34 L 36 -14 L 0 6 L -36 -14 Z" fill="#1E6FD9" fill-opacity="0.14"/>
      <path d="M -36 -14 L 0 6 L 0 35 L -36 15 Z" fill="#1E6FD9" fill-opacity="0.07"/>
      <path d="M 36 -14 L 0 6 L 0 35 L 36 15 Z" fill="#1E6FD9" fill-opacity="0.04"/>
    </g>
    <circle cx="4" cy="6" r="17" fill="none" stroke="#16A34A" stroke-opacity="0.8" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text class="t mono" x="0" y="57" font-size="10" fill="#6EE7A0" text-anchor="middle">difference()</text>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="74">VIBE-CODING CAMP · SESSION 3</text>
  <text class="t h1" x="196" y="124">model it, then walk inside it</text>
  <text class="t sub" x="196" y="154">Describe a shape in words, export it to GLB, then drop it into your own web 3D space.</text>

  <!-- 태그 -->
  <g transform="translate(196,176)">
    <g>
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="42" y="17.5" text-anchor="middle">one day</text>
    </g>
    <g transform="translate(94,0)">
      <rect x="0" y="0" width="116" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="58" y="17.5" text-anchor="middle">browser only</text>
    </g>
    <g transform="translate(220,0)">
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="54" y="17.5" text-anchor="middle">Node.js LTS</text>
    </g>
    <g transform="translate(338,0)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.45"/>
      <text class="t tag mono" x="65" y="17.5" text-anchor="middle">React Three Fiber</text>
    </g>
  </g>

  <!-- 우측: 내가 만든 공간 안을 돌아다니는 화면 -->
  <g transform="translate(878,46)" opacity="0.96">
    <rect width="212" height="152" rx="8" fill="#0B1B33" stroke="#2B4F85"/>
    <path d="M0 24 h212" stroke="#2B4F85" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#3E6FA8"/><circle cx="26" cy="12" r="3" fill="#3E6FA8"/><circle cx="38" cy="12" r="3" fill="#3E6FA8"/>
    <text class="t mono" x="56" y="16" font-size="9.5" fill="#6F87A6">localhost:5173</text>
    <!-- 바닥 -->
    <path d="M 18 118 L 194 118 L 168 86 L 44 86 Z" fill="#12294A" stroke="#2B4F85"/>
    <g stroke="#2B4F85" stroke-opacity="0.7" stroke-width="0.8">
      <path d="M 62 86 L 44 118"/><path d="M 84 86 L 75 118"/><path d="M 106 86 L 106 118"/>
      <path d="M 128 86 L 137 118"/><path d="M 150 86 L 168 118"/>
    </g>
    <!-- 오전에 만든 큐브가 장면 안에 있다 -->
    <g transform="translate(74,96)">
      <path d="M 0 -14 L 16 -6 L 0 2 L -16 -6 Z" fill="#1E6FD9" fill-opacity="0.45" stroke="#7FB2FF" stroke-width="1"/>
      <path d="M -16 -6 L 0 2 L 0 16 L -16 8 Z" fill="#1E6FD9" fill-opacity="0.25" stroke="#7FB2FF" stroke-width="1"/>
      <path d="M 16 -6 L 0 2 L 0 16 L 16 8 Z" fill="#1E6FD9" fill-opacity="0.15" stroke="#7FB2FF" stroke-width="1"/>
    </g>
    <!-- 캐릭터 -->
    <g transform="translate(140,92)" stroke="#C4A3F5" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="0" cy="-10" r="5" fill="#7C3AED" fill-opacity="0.35"/>
      <path d="M 0 -5 L 0 8"/><path d="M 0 0 L -7 5"/><path d="M 0 0 L 7 4"/>
      <path d="M 0 8 L -6 20"/><path d="M 0 8 L 7 19"/>
    </g>
    <g class="t mono" font-size="9" text-anchor="middle">
      <text x="74" y="136" fill="#7FB2FF">your GLB</text>
      <text x="152" y="136" fill="#C4A3F5">WASD</text>
    </g>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>
</svg>
