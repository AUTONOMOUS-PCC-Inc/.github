<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Six stage course pipeline: install, create car, collect, train, drive autonomously, extract worst frames">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#112744"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#3E6FA8"/>
    </marker>
    <style>
      .t    { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
      .ttl  { font-size: 14px; font-weight: 700; fill: #E9F1FD; }
      .num  { font-size: 11px; font-weight: 700; fill: #0B1B33; }
      .out  { font-size: 10px; fill: #8FA3BF; }
      .io   { font-size: 12px; font-weight: 600; fill: #BFD3EE; }
      .cap  { font-size: 11.5px; fill: #6F87A6; }
      .sec  { font-size: 12px; font-weight: 600; fill: #7FB2FF; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="350" rx="10" fill="url(#pbg)"/>
  <text class="t sec" x="28" y="34">WHERE THIS LIBRARY IS USED</text>
  <text class="t cap" x="1172" y="34" text-anchor="end">session 1 of the AUTONOMOUS PCC vibe-coding camp · one day</text>

  <g transform="translate(28,56)">
    <!-- 01 install -->
    <g>
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#1E6FD9" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#1E6FD9"/><text class="t num" x="20" y="26" text-anchor="middle">01</text>
      <text class="t ttl" x="40" y="26">Install</text>
      <g class="t mono out"><text x="14" y="52">conda env create</text><text x="14" y="70">pip install -e .</text></g>
      <text class="t mono out" x="14" y="96" fill="#7FB2FF">donkey CLI on PATH</text>
    </g>
    <!-- 02 create -->
    <g transform="translate(192,0)">
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#1E6FD9" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#1E6FD9"/><text class="t num" x="20" y="26" text-anchor="middle">02</text>
      <text class="t ttl" x="40" y="26">Create car</text>
      <g class="t mono out"><text x="14" y="52">donkey createcar</text><text x="14" y="70">myconfig.py</text></g>
      <text class="t mono out" x="14" y="96" fill="#7FB2FF">cars/mycar</text>
    </g>
    <!-- 03 collect -->
    <g transform="translate(384,0)">
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#16A34A" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#16A34A"/><text class="t num" x="20" y="26" text-anchor="middle">03</text>
      <text class="t ttl" x="40" y="26">Collect</text>
      <g class="t mono out"><text x="14" y="52">manage.py drive</text><text x="14" y="70">web UI :8887</text></g>
      <text class="t mono out" x="14" y="96" fill="#6EE7A0">tub: jpg + angle</text>
    </g>
    <!-- 04 train -->
    <g transform="translate(576,0)">
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#16A34A" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#16A34A"/><text class="t num" x="20" y="26" text-anchor="middle">04</text>
      <text class="t ttl" x="40" y="26">Train</text>
      <g class="t mono out"><text x="14" y="52">donkey train</text><text x="14" y="70">linear pilot · CPU</text></g>
      <text class="t mono out" x="14" y="96" fill="#6EE7A0">models/mypilot.h5</text>
    </g>
    <!-- 05 drive -->
    <g transform="translate(768,0)">
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#7C3AED" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#7C3AED"/><text class="t num" x="20" y="26" text-anchor="middle">05</text>
      <text class="t ttl" x="40" y="26">Autonomous</text>
      <g class="t mono out"><text x="14" y="52">drive --model</text><text x="14" y="70">local_angle mode</text></g>
      <text class="t mono out" x="14" y="96" fill="#C4A3F5">a lap, or a crash</text>
    </g>
    <!-- 06 vibe coding -->
    <g transform="translate(960,0)">
      <rect width="170" height="110" rx="8" fill="#12294A" stroke="#EAB308" stroke-opacity="0.55"/>
      <circle cx="20" cy="22" r="11" fill="#EAB308"/><text class="t num" x="20" y="26" text-anchor="middle">06</text>
      <text class="t ttl" x="40" y="26">Vibe-coding</text>
      <g class="t mono out"><text x="14" y="52">worst_frames.py</text><text x="14" y="70">model vs human</text></g>
      <text class="t mono out" x="14" y="96" fill="#F3D468">10 jpg, named</text>
    </g>
    <!-- 화살표 -->
    <g stroke="#3E6FA8" stroke-width="1.6" marker-end="url(#arr)">
      <line x1="170" y1="56" x2="186" y2="56"/>
      <line x1="362" y1="56" x2="378" y2="56"/>
      <line x1="554" y1="56" x2="570" y2="56"/>
      <line x1="746" y1="56" x2="762" y2="56"/>
      <line x1="938" y1="56" x2="954" y2="56"/>
    </g>
  </g>

  <!-- 라이브러리 경계 -->
  <g transform="translate(28,180)">
    <rect width="1144" height="54" rx="8" fill="#0E2342" stroke="#2B4F85" stroke-dasharray="4 4"/>
    <text class="t io" x="20" y="24">THIS REPO</text>
    <text class="t cap" x="110" y="24">provides every stage above — the donkey CLI, the drive loop, the tub format, the training pipeline and the model classes.</text>
    <text class="t cap" x="110" y="43" fill="#8FA3BF">Stage 03 and 05 also need the simulator bridge: see the sibling mirror gym-donkeycar.</text>
  </g>

  <!-- 측정값 -->
  <g transform="translate(28,252)">
    <rect width="1144" height="58" rx="8" fill="#0E2342" stroke="#EAB308" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <text class="t io" x="20" y="24" fill="#F3D468">MEASURED</text>
    <text class="t cap" x="110" y="24">Stage 04 on CPU, 2026-10-10: about 3.1 s per epoch per 1,000 training records, plus roughly 10 s of startup per run.</text>
    <text class="t cap" x="110" y="43" fill="#8FA3BF">10,000 records x 40 epochs is ~17 min on a 16-core desktop, and 50-85 min on a student laptop — plan the afternoon around that.</text>
  </g>

  <g transform="translate(28,330)">
    <text class="t cap" x="0" y="8">Nothing here is modified for the course: the stages are plain upstream donkeycar, driven from the course repository.</text>
  </g>
</svg>
