<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="donkeycar web controller patch — the car moves only while a key is held; release it and throttle decays to zero while steering recenters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 40px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
      .key{ font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#bg)"/>
  <circle cx="960" cy="125" r="180" fill="url(#glow)"/>

  <!-- 좌측: WASD 키 클러스터. W는 눌린 상태로 칠한다 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="56" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <g class="t mono key" text-anchor="middle">
      <g>
        <rect x="-18" y="-38" width="36" height="36" rx="9" fill="none" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.3"/>
        <rect x="-13" y="-33" width="26" height="26" rx="6" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A"/>
        <text x="0" y="-15" fill="#07210F">W</text>
      </g>
      <g>
        <rect x="-43" y="1" width="26" height="26" rx="6" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="-30" y="19" fill="#7FB2FF">A</text>
      </g>
      <g>
        <rect x="-13" y="1" width="26" height="26" rx="6" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="0" y="19" fill="#7FB2FF">S</text>
      </g>
      <g>
        <rect x="17" y="1" width="26" height="26" rx="6" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="30" y="19" fill="#7FB2FF">D</text>
      </g>
    </g>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="74">DONKEYCAR WEB CONTROLLER · PATCH</text>
  <text class="t h1" x="196" y="124">drive it with the keyboard</text>
  <text class="t sub" x="196" y="154">The car moves only while a key is held. Release it and the throttle decays to zero, steering recenters.</text>

  <!-- 태그 -->
  <g transform="translate(196,176)">
    <g>
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="59" y="17.5" text-anchor="middle">hold-to-drive</text>
    </g>
    <g transform="translate(128,0)">
      <rect x="0" y="0" width="128" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="64" y="17.5" text-anchor="middle">WASD + arrows</text>
    </g>
    <g transform="translate(266,0)">
      <rect x="0" y="0" width="94" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.45"/>
      <text class="t tag mono" x="47" y="17.5" text-anchor="middle">IME-safe</text>
    </g>
    <g transform="translate(370,0)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="40" y="17.5" text-anchor="middle">3 files</text>
    </g>
  </g>

  <!-- 우측: 스로틀 램프. 누르는 동안 0.10/틱 상승, 떼면 0.25/틱 감쇠 -->
  <g transform="translate(958,125)">
    <g class="t mono" font-size="10.5">
      <!-- max 기준선 -->
      <line x1="-132" y1="-38" x2="118" y2="-38" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="124" y="-34" fill="#4F6E9E">max</text>
      <!-- 0 기준선 -->
      <line x1="-132" y1="52" x2="118" y2="52" stroke="#2B4F85" stroke-width="1"/>
      <text x="124" y="56" fill="#4F6E9E">0</text>

      <!-- 키를 누르고 있는 구간 -->
      <path d="M -120 52 L -58 -38 L 24 -38 L 24 52 Z" fill="url(#hold)"/>
      <line x1="24" y1="-52" x2="24" y2="52" stroke="#7FB2FF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- 스로틀 곡선 -->
      <path d="M -120 52 L -58 -38 L 24 -38 L 58 52 L 112 52"
            fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 구간 이름 -->
      <text x="-48" y="-48" fill="#16A34A">W held</text>
      <text x="30" y="-48" fill="#8FA3BF">released</text>

      <!-- 기울기 -->
      <text x="-116" y="12" fill="#7FB2FF">+0.10/tick</text>
      <text x="34" y="26" fill="#C4A3F5">&#8722;0.25/tick</text>
    </g>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>
</svg>
