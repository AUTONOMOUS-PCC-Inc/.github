<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="The same loop twice: ask, look at the screen, ask again — in the morning with OpenSCAD and in the afternoon with React Three Fiber">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#112744"/>
    </linearGradient>
    <marker id="cyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7FB2FF"/>
    </marker>
    <marker id="cycp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#C4A3F5"/>
    </marker>
    <style>
      .t    { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
      .io   { font-size: 12px; font-weight: 600; fill: #BFD3EE; }
      .cap  { font-size: 11.5px; fill: #6F87A6; }
      .sec  { font-size: 12px; font-weight: 600; fill: #7FB2FF; letter-spacing: 2px; }
      .ctr  { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .ctr2 { font-size: 10px; fill: #6F87A6; }
    </style>
  </defs>

  <rect width="1200" height="330" rx="10" fill="url(#pbg)"/>
  <text class="t sec" x="28" y="34">THE ONE SKILL BEING TAUGHT</text>
  <text class="t cap" x="1172" y="34" text-anchor="end">describe it · look at it · ask again — the tool changes, the loop does not</text>

  <!-- 오전 루프 -->
  <g transform="translate(300,160)">
    <circle r="78" fill="none" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>
    <text class="t ctr" x="0" y="-4" fill="#7FB2FF" text-anchor="middle">MORNING</text>
    <text class="t mono ctr2" x="0" y="14" text-anchor="middle">OpenSCAD · no install</text>
    <g class="t mono" font-size="10.5" text-anchor="middle">
      <g>
        <rect x="-56" y="-96" width="112" height="24" rx="12" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="0" y="-80" fill="#7FB2FF">say the shape</text>
      </g>
      <g>
        <rect x="18" y="30" width="118" height="24" rx="12" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.6"/>
        <text x="77" y="46" fill="#7FB2FF">press Render</text>
      </g>
      <g>
        <rect x="-136" y="30" width="118" height="24" rx="12" fill="#0B1B33" stroke="#16A34A" stroke-opacity="0.6"/>
        <text x="-77" y="46" fill="#6EE7A0">it is wrong</text>
      </g>
    </g>
    <g fill="none" stroke="#7FB2FF" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#cyc)">
      <path d="M 52 -58 A 78 78 0 0 1 76 -12"/>
      <path d="M 50 62 A 78 78 0 0 1 -48 64"/>
      <path d="M -76 -14 A 78 78 0 0 1 -50 -60"/>
    </g>
  </g>

  <!-- 오후 루프 -->
  <g transform="translate(900,160)">
    <circle r="78" fill="none" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>
    <text class="t ctr" x="0" y="-4" fill="#C4A3F5" text-anchor="middle">AFTERNOON</text>
    <text class="t mono ctr2" x="0" y="14" text-anchor="middle">R3F · save and it redraws</text>
    <g class="t mono" font-size="10.5" text-anchor="middle">
      <g>
        <rect x="-62" y="-96" width="124" height="24" rx="12" fill="#0B1B33" stroke="#7C3AED" stroke-opacity="0.6"/>
        <text x="0" y="-80" fill="#C4A3F5">ask for the change</text>
      </g>
      <g>
        <rect x="18" y="30" width="122" height="24" rx="12" fill="#0B1B33" stroke="#7C3AED" stroke-opacity="0.6"/>
        <text x="79" y="46" fill="#C4A3F5">watch the tab</text>
      </g>
      <g>
        <rect x="-140" y="30" width="122" height="24" rx="12" fill="#0B1B33" stroke="#16A34A" stroke-opacity="0.6"/>
        <text x="-79" y="46" fill="#6EE7A0">it is wrong</text>
      </g>
    </g>
    <g fill="none" stroke="#C4A3F5" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#cycp)">
      <path d="M 52 -58 A 78 78 0 0 1 76 -12"/>
      <path d="M 50 62 A 78 78 0 0 1 -48 64"/>
      <path d="M -76 -14 A 78 78 0 0 1 -50 -60"/>
    </g>
  </g>

  <!-- 가운데: 같은 루프라는 표시 -->
  <g transform="translate(600,160)">
    <text class="t mono" x="0" y="-4" font-size="26" fill="#3E6FA8" text-anchor="middle">=</text>
    <text class="t cap" x="0" y="26" text-anchor="middle">same loop</text>
  </g>

  <!-- 탈출구 -->
  <g transform="translate(28,266)">
    <rect width="1144" height="46" rx="8" fill="#0B2A1C" stroke="#16A34A" stroke-opacity="0.6" stroke-dasharray="4 4"/>
    <text class="t io" x="20" y="20" fill="#6EE7A0">THE ESCAPE HATCH</text>
    <text class="t cap" x="166" y="20">git restore . puts every tracked file back to the moment you cloned it. There is no state to lose and nothing to reinstall.</text>
    <text class="t cap" x="166" y="37" fill="#8FA3BF">So break it on purpose. The loop above only teaches you something when the screen disagrees with what you asked for.</text>
  </g>
</svg>
