<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Vibe-coding camp session 3 — hand one weekly chore to an agent, built twice: once in code with Codex and once no-code with n8n">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="aaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <marker id="abarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7FB2FF"/>
    </marker>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 40px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#abg)"/>
  <circle cx="975" cy="125" r="185" fill="url(#aglow)"/>

  <!-- 좌측: 에이전트 루프 — 빨간 테스트를 돌며 초록으로 바꾼다 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="58" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="46" fill="none" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>
    <g fill="none" stroke="#7FB2FF" stroke-opacity="0.75" stroke-width="2" marker-end="url(#abarrow)">
      <path d="M 32 -33 A 46 46 0 0 1 44 -8"/>
      <path d="M 30 35 A 46 46 0 0 1 -28 36"/>
      <path d="M -45 -9 A 46 46 0 0 1 -30 -34"/>
    </g>
    <rect x="-23" y="-16" width="46" height="32" rx="4" fill="#0B1B33" stroke="#2B4F85"/>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M -15 -7 h 20" stroke="#EF4444"/>
      <path d="M -15 0 h 14" stroke="#EF4444"/>
      <path d="M -15 7 h 24" stroke="#16A34A"/>
    </g>
    <text class="t mono" x="0" y="57" font-size="10" fill="#6EE7A0" text-anchor="middle">until it is green</text>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="74">VIBE-CODING CAMP · SESSION 3</text>
  <text class="t h1" x="196" y="124">hand one weekly chore to an agent</text>
  <text class="t sub" x="196" y="154">The same job twice — once in code with Codex, once no-code with n8n. Then compare.</text>

  <!-- 태그 -->
  <g transform="translate(196,176)">
    <g>
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="42" y="17.5" text-anchor="middle">one day</text>
    </g>
    <g transform="translate(94,0)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="56" y="17.5" text-anchor="middle">no install</text>
    </g>
    <g transform="translate(216,0)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="56" y="17.5" text-anchor="middle">API keys 0</text>
    </g>
    <g transform="translate(338,0)">
      <rect x="0" y="0" width="128" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.45"/>
      <text class="t tag mono" x="64" y="17.5" text-anchor="middle">Codex + n8n</text>
    </g>
  </g>

  <!-- 우측: 아침 8시에 메일 한 통이 와 있다 -->
  <g transform="translate(878,46)" opacity="0.96">
    <rect width="212" height="152" rx="8" fill="#0B1B33" stroke="#2B4F85"/>
    <path d="M0 24 h212" stroke="#2B4F85" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#3E6FA8"/><circle cx="26" cy="12" r="3" fill="#3E6FA8"/><circle cx="38" cy="12" r="3" fill="#3E6FA8"/>
    <text class="t mono" x="56" y="16" font-size="9.5" fill="#6F87A6">inbox · 08:00</text>

    <!-- 메일 카드 -->
    <g transform="translate(16,38)">
      <rect width="180" height="42" rx="5" fill="#12294A" stroke="#2B4F85"/>
      <circle cx="15" cy="21" r="7" fill="#7C3AED" fill-opacity="0.35" stroke="#C4A3F5" stroke-width="1"/>
      <text class="t mono" x="31" y="18" font-size="9" fill="#BFD3EE">today's digest</text>
      <text class="t mono" x="31" y="31" font-size="8.5" fill="#6F87A6">summarised while you slept</text>
    </g>

    <!-- 그것을 만든 흐름 -->
    <g transform="translate(16,96)" class="t mono" font-size="8" text-anchor="middle">
      <g>
        <rect x="0" y="0" width="38" height="20" rx="4" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.55"/>
        <text x="19" y="13.5" fill="#7FB2FF">08:00</text>
      </g>
      <g transform="translate(47,0)">
        <rect x="0" y="0" width="38" height="20" rx="4" fill="#0B1B33" stroke="#1E6FD9" stroke-opacity="0.55"/>
        <text x="19" y="13.5" fill="#7FB2FF">fetch</text>
      </g>
      <g transform="translate(94,0)">
        <rect x="0" y="0" width="38" height="20" rx="4" fill="#0B1B33" stroke="#16A34A" stroke-opacity="0.55"/>
        <text x="19" y="13.5" fill="#6EE7A0">sum</text>
      </g>
      <g transform="translate(141,0)">
        <rect x="0" y="0" width="38" height="20" rx="4" fill="#0B1B33" stroke="#7C3AED" stroke-opacity="0.55"/>
        <text x="19" y="13.5" fill="#C4A3F5">mail</text>
      </g>
      <g stroke="#2B4F85" stroke-width="1">
        <path d="M 38 10 h 9"/><path d="M 85 10 h 9"/><path d="M 132 10 h 9"/>
      </g>
    </g>
    <text class="t mono" x="106" y="136" font-size="9" fill="#6F87A6" text-anchor="middle">you built this before lunch</text>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#aaccent)" opacity="0.85"/>
</svg>
